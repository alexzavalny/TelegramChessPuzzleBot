<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--light:#f0f1ec;--dark:#9db392;--ink:#181825;--sel:rgba(63,185,80,.45);--last:rgba(63,185,80,.22)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:system-ui,sans-serif;color:var(--ink)}
.wrap{padding:4px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:0 2px 6px}
.status{font-weight:600}
.reset{border:0;border-radius:100px;padding:5px 11px;background:rgba(24,24,37,.08);font:600 11px system-ui,sans-serif;color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(8,1fr);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(24,24,37,.15);user-select:none;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1}
.sq.l{background:var(--light)}
.sq.d{background:var(--dark)}
.sq.sel::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:var(--sel)}
.sq.last::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:var(--last)}
.pc{position:relative;z-index:1;width:100%;height:100%;padding:5%}
.pc.w svg{fill:#fff;stroke:#1b1b1b;stroke-width:1.4;stroke-linejoin:round}
.pc.b svg{fill:#181825;stroke:#181825;stroke-width:1.1;stroke-linejoin:round}
svg{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="status" id="st">White to move</span><button class="reset" id="rs">Reset</button></div>
  <div class="board" id="bd"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="p" viewBox="0 0 45 45">
    <circle cx="22.5" cy="11.5" r="5"/>
    <path d="M17.8 18h9.4c0 4.4-2 6.3-3.5 9.2h3.5v5.2H17.8v-5.2h3.5c-1.5-2.9-3.5-4.8-3.5-9.2z"/>
    <rect x="12" y="32.4" width="21" height="3.2" rx="1.3"/>
    <rect x="9.5" y="35.6" width="26" height="4.2" rx="2"/>
  </symbol>
  <symbol id="r" viewBox="0 0 45 45">
    <path d="M11 8h5v3h4V8h5v3h4V8h5v10H11z"/>
    <path d="M14.5 18h16l-1.5 12.4H16z"/>
    <rect x="12" y="30.4" width="21" height="3.2" rx="1.3"/>
    <rect x="9.5" y="33.6" width="26" height="4.2" rx="2"/>
  </symbol>
  <symbol id="n" viewBox="0 0 45 45">
    <path d="M9.8 24.5c0-3.2 1.7-5.6 4.4-7l4.2-2.3-1.2-4.6 4.2 1.9L23 7.5l3.1 5.6c4.6 1.7 7.3 5.8 7.3 11.1v5.6H17.8l2.6-6.6-4 .5-4.3 1.7z"/>
    <circle cx="21.3" cy="15.2" r=".9" fill="#181825" stroke="none"/>
    <rect x="12" y="30.2" width="21" height="3.2" rx="1.3"/>
    <rect x="9.5" y="33.4" width="26" height="4.2" rx="2"/>
  </symbol>
  <symbol id="b" viewBox="0 0 45 45">
    <circle cx="22.5" cy="7" r="2.3"/>
    <path d="M22.5 9.6c4.1 3.2 6.1 6.4 6.1 9.6 0 2.2-1 3.9-2.4 5.2H18.8c-1.4-1.3-2.4-3-2.4-5.2 0-3.2 2-6.4 6.1-9.6z"/>
    <path d="M17.2 24.8h10.6l1.7 6.4H15.5z"/>
    <rect x="12" y="31.2" width="21" height="3.1" rx="1.3"/>
    <rect x="9.5" y="34.3" width="26" height="4.2" rx="2"/>
  </symbol>
  <symbol id="q" viewBox="0 0 45 45">
    <path d="M9.5 11l4.6 8.8-4.1-1.9 4.5 10.6h16l4.5-10.6-4.1 1.9L35.5 11l-6.6 6.1L25.4 7l-3.4 10.1L18.6 7z"/>
    <rect x="12" y="29.2" width="21" height="3.1" rx="1.3"/>
    <rect x="9.5" y="32.3" width="26" height="4.2" rx="2"/>
  </symbol>
  <symbol id="k" viewBox="0 0 45 45">
    <path d="M21.3 4.6h2.4v2.3h2.4v2.3h-2.4V12h-2.4V9.2h-2.4V6.9h2.4z"/>
    <path d="M22.5 12.6c4 0 7 2.5 7 5.5 0 2-1 3.7-2.6 4.7l1 5.4h-11l1-5.4c-1.6-1-2.6-2.7-2.6-4.7 0-3 3-5.5 7-5.5z"/>
    <rect x="12" y="28.9" width="21" height="3.1" rx="1.3"/>
    <rect x="9.5" y="32" width="26" height="4.2" rx="2"/>
  </symbol>
</svg>
<script>
var START = 'rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR';
var board = START.split('');
var sel = null, turn = 'w', moves = 0, last = null;
var bd = document.getElementById('bd');
var cells = [];
for (var i = 0; i < 64; i++) {
  var c = document.createElement('div');
  var r = Math.floor(i / 8), f = i % 8;
  c.className = 'sq ' + ((r + f) % 2 === 0 ? 'l' : 'd');
  c.dataset.i = i;
  bd.appendChild(c);
  cells.push(c);
}
function draw() {
  for (var i = 0; i < 64; i++) {
    var cell = cells[i];
    cell.className = 'sq ' + ((Math.floor(i / 8) + i % 8) % 2 === 0 ? 'l' : 'd');
    if (sel === i) cell.classList.add('sel');
    if (last && (last[0] === i || last[1] === i)) cell.classList.add('last');
    var code = board[i];
    cell.innerHTML = '';
    if (code !== '.') {
      var color = code === code.toUpperCase() ? 'w' : 'b';
      var wrap = document.createElement('div');
      wrap.className = 'pc ' + color;
      wrap.style.color = color === 'w' ? '#ffffff' : '#181825';
      wrap.innerHTML = '<svg><use href="#' + code.toLowerCase() + '"/></svg>';
      cell.appendChild(wrap);
    }
  }
  document.getElementById('st').textContent = (turn === 'w' ? 'White' : 'Black') + ' to move · ' + moves;
}
bd.addEventListener('click', function (e) {
  var cell = e.target;
  while (cell && !(cell.classList && cell.classList.contains('sq'))) cell = cell.parentElement;
  if (!cell) return;
  var i = +cell.dataset.i;
  var code = board[i];
  if (sel === null) {
    if (code !== '.') sel = i;
  } else if (i === sel) {
    sel = null;
  } else if (code !== '.' && (code === code.toUpperCase()) === (board[sel] === board[sel].toUpperCase())) {
    sel = i;
  } else {
    board[i] = board[sel];
    board[sel] = '.';
    last = [sel, i];
    sel = null;
    moves++;
    turn = turn === 'w' ? 'b' : 'w';
  }
  draw();
});
document.getElementById('rs').addEventListener('click', function () {
  board = START.split(''); sel = null; turn = 'w'; moves = 0; last = null; draw();
});
draw();
</script>
</body>
</html>
