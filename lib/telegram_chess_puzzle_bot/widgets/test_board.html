<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;padding:4px;background:transparent;font-family:system-ui,sans-serif;color:#181825;-webkit-user-select:none;user-select:none}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px;font-size:12px;font-weight:600}
#rs{border:0;border-radius:100px;padding:5px 11px;background:rgba(24,24,37,.08);color:#181825;font:600 11px system-ui,sans-serif}
</style>
</head>
<body>
<div class="top"><span id="st">White to move &middot; 0</span><button id="rs" type="button">Reset</button></div>
<div id="bd" style="position:relative;width:100%;height:300px;border-radius:10px;overflow:hidden"></div>
<script>
var LIGHT="#f0f1ec",DARK="#9db392",SEL="#7fc98a",LAST="#c9e3bd";
var START="rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR";
var PATHS={
p:'<circle cx="22.5" cy="11.5" r="5"/><path d="M17.8 18h9.4c0 4.4-2 6.3-3.5 9.2h3.5v5.2H17.8v-5.2h3.5c-1.5-2.9-3.5-4.8-3.5-9.2z"/><rect x="12" y="32.4" width="21" height="3.2" rx="1.3"/><rect x="9.5" y="35.6" width="26" height="4.2" rx="2"/>',
r:'<path d="M11 8h5v3h4V8h5v3h4V8h5v10H11z"/><path d="M14.5 18h16l-1.5 12.4H16z"/><rect x="12" y="30.4" width="21" height="3.2" rx="1.3"/><rect x="9.5" y="33.6" width="26" height="4.2" rx="2"/>',
n:'<path d="M9.8 24.5c0-3.2 1.7-5.6 4.4-7l4.2-2.3-1.2-4.6 4.2 1.9L23 7.5l3.1 5.6c4.6 1.7 7.3 5.8 7.3 11.1v5.6H17.8l2.6-6.6-4 .5-4.3 1.7z"/><circle cx="21.3" cy="15.2" r=".9" fill="#181825" stroke="none"/><rect x="12" y="30.2" width="21" height="3.2" rx="1.3"/><rect x="9.5" y="33.4" width="26" height="4.2" rx="2"/>',
b:'<circle cx="22.5" cy="7" r="2.3"/><path d="M22.5 9.6c4.1 3.2 6.1 6.4 6.1 9.6 0 2.2-1 3.9-2.4 5.2H18.8c-1.4-1.3-2.4-3-2.4-5.2 0-3.2 2-6.4 6.1-9.6z"/><path d="M17.2 24.8h10.6l1.7 6.4H15.5z"/><rect x="12" y="31.2" width="21" height="3.1" rx="1.3"/><rect x="9.5" y="34.3" width="26" height="4.2" rx="2"/>',
q:'<path d="M9.5 11l4.6 8.8-4.1-1.9 4.5 10.6h16l4.5-10.6-4.1 1.9L35.5 11l-6.6 6.1L25.4 7l-3.4 10.1L18.6 7z"/><path d="M14 28.6h17l1.8 3.4H12.2z"/><rect x="12" y="31.6" width="21" height="3.1" rx="1.3"/><rect x="9.5" y="34.7" width="26" height="4.2" rx="2"/>',
k:'<path d="M21.3 4.6h2.4v2.3h2.4v2.3h-2.4V12h-2.4V9.2h-2.4V6.9h2.4z"/><path d="M22.5 12.6c4 0 7 2.5 7 5.5 0 2-1 3.7-2.6 4.7l1 5.4h-11l1-5.4c-1.6-1-2.6-2.7-2.6-4.7 0-3 3-5.5 7-5.5z"/><rect x="12" y="28.9" width="21" height="3.1" rx="1.3"/><rect x="9.5" y="32" width="26" height="4.2" rx="2"/>'
};
var board=START.split(""),sel=null,turn="w",moves=0,last=null;
var bd=document.getElementById("bd"),cells=[];
function sizeBoard(){
  var w=bd.offsetWidth;
  if(w&&Math.abs(bd.offsetHeight-w)>1)bd.style.height=w+"px";
}
sizeBoard();
window.addEventListener("resize",sizeBoard);
for(var i=0;i<64;i++){
  var r=Math.floor(i/8),f=i%8,d=document.createElement("div");
  d.style.position="absolute";
  d.style.left=(f*12.5)+"%";
  d.style.top=(r*12.5)+"%";
  d.style.width="12.5%";
  d.style.height="12.5%";
  d.style.display="flex";
  d.style.alignItems="center";
  d.style.justifyContent="center";
  d.dataset.i=i;
  bd.appendChild(d);
  cells.push(d);
}
function draw(){
  for(var i=0;i<64;i++){
    var cell=cells[i],r=Math.floor(i/8),f=i%8;
    cell.style.background=((r+f)%2?DARK:LIGHT);
    if(sel===i)cell.style.background=SEL;
    else if(last&&(last[0]===i||last[1]===i))cell.style.background=LAST;
    var code=board[i];
    cell.innerHTML="";
    if(code!=="."){
      var white=code===code.toUpperCase();
      cell.innerHTML='<svg viewBox="0 0 45 45" style="display:block;width:100%;height:100%;padding:5%;box-sizing:border-box" fill="'+(white?"#fff":"#181825")+'" stroke="'+(white?"#1b1b1b":"#181825")+'" stroke-width="'+(white?1.4:1.1)+'" stroke-linejoin="round">'+PATHS[code.toLowerCase()]+"</svg>";
    }
  }
  document.getElementById("st").textContent=(turn==="w"?"White":"Black")+" to move \u00b7 "+moves;
}
bd.addEventListener("click",function(e){
  var cell=e.target;
  while(cell&&!(cell.dataset&&cell.dataset.i!==undefined))cell=cell.parentElement;
  if(!cell)return;
  var i=+cell.dataset.i,code=board[i];
  if(sel===null){if(code!==".")sel=i}
  else if(i===sel){sel=null}
  else if(code!=="."&&(code===code.toUpperCase())===(board[sel]===board[sel].toUpperCase())){sel=i}
  else{
    board[i]=board[sel];board[sel]=".";
    last=[sel,i];sel=null;moves++;
    turn=turn==="w"?"b":"w";
  }
  draw();
});
document.getElementById("rs").addEventListener("click",function(){
  board=START.split("");sel=null;turn="w";moves=0;last=null;draw();
});
draw();
</script>
</body>
</html>
